# /etc/nginx/sites-available/ads.pilotworks4u.com — same shape as SEOPilot's. certbot --nginx -d ads.pilotworks4u.com adds the 443 block.
server {
    listen 80;
    server_name ads.pilotworks4u.com;
    location / {
        proxy_pass http://127.0.0.1:4020;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
}
